name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verifikasi (baris, rahasia, tipe, tes)
        run: npm run verify
      - name: Bangun installer Windows (MSI) + checksum
        run: npm run dist -w @rekanbot/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: |
            apps/desktop/release/*.msi
            apps/desktop/release/*.sha256
      - name: Rilis (hanya untuk tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" apps/desktop/release/*.msi apps/desktop/release/*.sha256 --title "RekanBot ${{ github.ref_name }}" --generate-notes
