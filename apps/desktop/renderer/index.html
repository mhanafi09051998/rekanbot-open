<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'">
<title>RekanBot</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="atas">
  <div class="merek"><span class="lambang">RB</span><span>REKANBOT</span></div>
  <button class="chip" id="folder-btn" title="Pilih folder kerja"><span class="lbl">FOLDER</span><span id="folder">...</span></button>
  <span class="ruang"></span>
  <button class="chip" id="provider-label" title="Ganti provider">...</button>
  <button class="chip" id="mode-label" title="Mode izin">...</button>
  <button class="btn kecil" id="new-btn">Baru</button>
  <button class="btn kecil" id="settings-btn">Pengaturan</button>
</header>

<main id="log" class="log" aria-live="polite"></main>

<footer class="bawah">
  <div id="todos" class="todos" hidden></div>
  <div class="komposer">
    <textarea id="prompt" rows="1" placeholder="Minta RekanBot mengerjakan sesuatu di folder ini…  (Enter kirim, Shift+Enter baris baru)"></textarea>
    <button id="send" class="btn utama">Kirim</button>
  </div>
</footer>

<dialog id="approval"></dialog>
<dialog id="settings"></dialog>
<script src="app.js"></script>
</body>
</html>
